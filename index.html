<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spotijai Pro</title>
    <style>
        :root { --bg: #000; --accent: #fa243c; --text: #fff; --gray: #1c1c1e; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; overflow-x: hidden; touch-action: pan-y; }
        
        .main-container { padding: 20px; padding-bottom: 180px; }
        .song-item { padding: 15px 20px; border-bottom: 0.5px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .song-info { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .song-item.active .song-info { font-weight: 800; color: var(--accent); }
        
        .btn-delete { background: none; border: none; color: #666; font-size: 18px; padding: 5px 10px; cursor: pointer; }

        /* Panel de Reproducción */
        #player { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 150px; 
            background: rgba(28,28,30,0.95); backdrop-filter: blur(20px);
            border-radius: 20px 20px 0 0; padding: 20px; transition: height 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden; touch-action: none; z-index: 100;
        }
        #player.expanded { height: 100vh; border-radius: 0; overflow-y: auto; }
        
        .seek-container { width: 100%; height: 6px; background: #444; border-radius: 3px; margin: 15px 0; }
        #seek-bar { height: 100%; width: 0%; background: #fff; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>Biblioteca</h1>
        <button onclick="document.getElementById('file-in').click()" style="background:var(--accent); border:none; color:white; padding:10px 20px; border-radius:20px; font-weight:600;">Añadir Música</button>
        <div id="main-list" style="margin-top:20px;"></div>
    </div>
    <input type="file" id="file-in" style="display:none" webkitdirectory multiple>

    <div id="player">
        <div id="handle" style="width:40px; height:5px; background:#444; margin:0 auto 15px; border-radius:3px;"></div>
        <div id="track-name" style="font-weight:bold; font-size:16px;">Selecciona una canción</div>
        
        <div class="seek-container" id="seek-container"><div id="seek-bar"></div></div>
        
        <div style="display:flex; justify-content:space-around; align-items:center; margin-top:15px;">
            <button onclick="toggleShuffle()" id="shuffle-btn" style="background:none; border:none; color:white; font-size:18px;">🔀</button>
            <button onclick="prev()" style="background:none; border:none; color:white;">⏮</button>
            <button onclick="togglePlay()" style="background:white; border-radius:20px; padding:8px 20px; border:none; font-weight:bold;">Play/Pausa</button>
            <button onclick="next()" style="background:none; border:none; color:white;">⏭</button>
        </div>

        <div style="margin-top:30px;">
            <h3>Lista de Reproducción</h3>
            <div id="queue-list"></div>
        </div>
    </div>

    <script>
        let db = [], currentIdx = -1, isShuffle = false;
        const audio = new Audio();
        const player = document.getElementById('player');

        // Gesto de deslizar arriba/abajo
        let startY;
        player.addEventListener('touchstart', e => startY = e.touches[0].clientY);
        player.addEventListener('touchend', e => {
            if (startY - e.changedTouches[0].clientY > 50) player.classList.add('expanded');
            else if (e.changedTouches[0].clientY - startY > 50) player.classList.remove('expanded');
        });

        // Carga de archivos
        document.getElementById('file-in').onchange = e => {
            db = Array.from(e.target.files).filter(f => f.name.endsWith('.mp3'));
            render();
        };

        function render() {
            const listHTML = db.length === 0 ? '<p style="color:#666;">No hay canciones añadidas</p>' : db.map((f, i) => `
                <div class="song-item ${i === currentIdx ? 'active' : ''}">
                    <div class="song-info" onclick="playAt(${i})">${f.name.replace('.mp3','')}</div>
                    <button class="btn-delete" onclick="deleteSong(event, ${i})">🗑</button>
                </div>
            `).join('');

            document.getElementById('main-list').innerHTML = listHTML;
            document.getElementById('queue-list').innerHTML = listHTML;
        }

        function playAt(i) {
            currentIdx = i;
            audio.src = URL.createObjectURL(db[i]);
            audio.play();
            document.getElementById('track-name').innerText = db[i].name.replace('.mp3', '');
            render();
        }

        function deleteSong(event, i) {
            event.stopPropagation(); // Evita que se reproduzca al dar clic en borrar
            if (i === currentIdx) {
                audio.pause();
                currentIdx = -1;
                document.getElementById('track-name').innerText = "Selecciona una canción";
                document.getElementById('seek-bar').style.width = "0%";
            } else if (i < currentIdx) {
                currentIdx--; // Ajusta el índice si borramos una canción anterior a la actual
            }
            db.splice(i, 1);
            render();
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            const btn = document.getElementById('shuffle-btn');
            btn.style.color = isShuffle ? 'var(--accent)' : 'white';
        }

        audio.onended = () => { next(); };

        function next() {
            if (db.length === 0) return;
            if (isShuffle) {
                let nextIdx;
                do {
                    nextIdx = Math.floor(Math.random() * db.length);
                } while (nextIdx === currentIdx && db.length > 1);
                playAt(nextIdx);
            } else {
                if (currentIdx < db.length - 1) playAt(currentIdx + 1);
                else playAt(0); // Vuelve al inicio si llega al final
            }
        }

        function prev() {
            if (db.length === 0) return;
            if (currentIdx > 0) playAt(currentIdx - 1);
            else playAt(db.length - 1);
        }

        audio.ontimeupdate = () => {
            if(audio.duration) {
                document.getElementById('seek-bar').style.width = (audio.currentTime / audio.duration) * 100 + "%";
            }
        };

        document.getElementById('seek-container').onclick = e => {
            if(audio.duration) {
                audio.currentTime = (e.offsetX / e.target.clientWidth) * audio.duration;
            }
        };

        function togglePlay() { 
            if (db.length === 0) return;
            if (audio.paused) {
                if(currentIdx === -1) playAt(0);
                else audio.play();
            } else {
                audio.pause();
            }
        }
    </script>
</body>
</html>
